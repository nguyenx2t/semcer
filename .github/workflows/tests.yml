name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install ruff && ruff check src tools tests
      # The CPU wheel of the pinned torch: the default Linux wheel bundles CUDA.
      - run: pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[test]'
      # Offline: the suite runs on the tiny bundle in tests/fixtures.
      - run: python -m pytest -n auto tests -q
        env:
          HF_HUB_OFFLINE: "1"
